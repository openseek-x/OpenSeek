appId: ai.deepseek.harness
productName: DeepSeek Harness
artifactName: DeepSeek-Harness-${version}-${os}-${arch}.${ext}
asar: false
npmRebuild: false
compression: normal
electronUpdaterCompatibility: '>= 2.16'

directories:
  output: ../../dist-desktop/installers

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  # package.ts applies the selected signature to the prepackaged application;
  # Builder must preserve it while creating the DMG and updater ZIP.
  identity: null
  notarize: false
  publish:
    provider: github
    owner: ${env.DESKTOP_UPDATE_OWNER}
    repo: ${env.DESKTOP_UPDATE_REPOSITORY_NAME}
    channel: ${env.DESKTOP_UPDATE_CHANNEL}
    publishAutoUpdate: true

dmg:
  title: DeepSeek Harness ${version}

win:
  target: nsis
  icon: assets/icon.ico
  # The workflow supplies CSC credentials only in explicit signed mode.
  signExecutable: true
  publish:
    provider: github
    owner: ${env.DESKTOP_UPDATE_OWNER}
    repo: ${env.DESKTOP_UPDATE_REPOSITORY_NAME}
    channel: ${env.DESKTOP_UPDATE_CHANNEL}
    publishAutoUpdate: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness

linux:
  target: tar.gz
  category: Development
  icon: assets/icon.png
  executableName: deepseek-harness
