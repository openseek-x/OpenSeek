# Desktop is the Web product composition with its network carrier and
# browser-only runtime rows replaced by Electron's in-process carrier.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject: []
  config:
    trustedHosts: []

- id: modules
  inject: []

- insert:
    - id: directory-picker-desktop
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-desktop
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: ui-desktop-update
      name: '@deepseek-ai/dsh-client-ui-desktop-update'
