name: Desktop packages
run-name: Desktop packages · ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    tags: ['dsh-v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_APP_ID: ai.deepseek.harness
  OPENSEEK_DESKTOP_RELEASE: '0.1.14'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
          - target: mac-x64
            runner: macos-15-intel
          - target: win-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify release identity
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node --input-type=module -e "import { isOpenSeekRelease } from './apps/desktop/scripts/desktop-release-environment.mjs'; if (!isOpenSeekRelease(process.env)) throw new Error('OpenSeek release mode required'); if (process.env.RELEASE_REF_TYPE === 'tag' && process.env.RELEASE_REF !== 'dsh-v' + process.env.OPENSEEK_DESKTOP_RELEASE) throw new Error('release tag does not match desktop version')"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and smoke-test bundled runtime
        run: pnpm --filter @deepseek-ai/dsh-desktop run package ${{ matrix.target }}
      - name: Verify macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts"
          application="$(find "$root" -maxdepth 3 -name 'DeepSeek Harness.app' -type d | head -1)"
          test -n "$application"
          codesign --verify --deep --strict --verbose=2 "$application"
          codesign -dv --verbose=4 "$application" 2>&1 | grep -Fx 'Signature=adhoc'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/latest*.yml
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Verify and publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2 ]
          [ "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2 ]
          [ "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1 ]
          test -f latest-arm64-mac.yml
          test -f latest-x64-mac.yml
          test -f latest.yml
          sha256sum *.dmg *.zip *.exe *.blockmap *.yml | sort -k2 > SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "OpenSeek ${RELEASE_TAG#dsh-v}" --draft
          diff <(find . -maxdepth 1 -type f -printf '%f\n' | sort) <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
